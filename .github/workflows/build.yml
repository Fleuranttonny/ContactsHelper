name: Build Contacts Helper APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/example/contacthelper
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ContactsHelper"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.contacthelper'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.contacthelper'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="Enregistrer un contact"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/contacthelper/MainActivity.java <<'EOF'
          package com.example.contacthelper;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.provider.ContactsContract;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private EditText nameField;
              private EditText phoneField;
              private EditText emailField;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  int pad = dp(22);
                  layout.setPadding(pad, pad, pad, pad);

                  TextView title = new TextView(this);
                  title.setText("Enregistrer un contact");
                  title.setTextSize(24);
                  title.setPadding(0, 0, 0, dp(18));
                  layout.addView(title);

                  nameField = addField(layout, "Nom du contact", "Jean Pierre");
                  phoneField = addField(layout, "Numéro de téléphone", "+509 3712 3456");
                  emailField = addField(layout, "E-mail (facultatif)", "nom@email.com");

                  Button saveButton = new Button(this);
                  saveButton.setText("OUVRIR CONTACTS POUR ENREGISTRER");
                  layout.addView(saveButton, new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  TextView info = new TextView(this);
                  info.setText("Après ouverture de Contacts, vérifiez les informations puis appuyez sur Enregistrer.");
                  info.setTextSize(14);
                  info.setPadding(0, dp(16), 0, 0);
                  layout.addView(info);

                  saveButton.setOnClickListener(v -> openContactsInsert());
                  setContentView(layout);
              }

              private EditText addField(LinearLayout layout, String label, String hint) {
                  TextView text = new TextView(this);
                  text.setText(label);
                  text.setTextSize(16);
                  text.setPadding(0, dp(12), 0, dp(4));
                  layout.addView(text);

                  EditText field = new EditText(this);
                  field.setSingleLine(true);
                  field.setHint(hint);
                  layout.addView(field, new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                  return field;
              }

              private void openContactsInsert() {
                  String name = nameField.getText().toString().trim();
                  String phone = phoneField.getText().toString().trim();
                  String email = emailField.getText().toString().trim();

                  if (name.isEmpty() || phone.isEmpty()) {
                      Toast.makeText(this, "Entrez le nom et le numéro.", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  Intent intent = new Intent(Intent.ACTION_INSERT);
                  intent.setType(ContactsContract.Contacts.CONTENT_TYPE);
                  intent.putExtra(ContactsContract.Intents.Insert.NAME, name);
                  intent.putExtra(ContactsContract.Intents.Insert.PHONE, phone);
                  if (!email.isEmpty()) {
                      intent.putExtra(ContactsContract.Intents.Insert.EMAIL, email);
                  }

                  try {
                      startActivity(intent);
                  } catch (Exception e) {
                      Toast.makeText(this, "Impossible d'ouvrir l'application Contacts.", Toast.LENGTH_LONG).show();
                  }
              }

              private int dp(int value) {
                  return (int) (value * getResources().getDisplayMetrics().density + 0.5f);
              }
          }
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ContactsHelper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

